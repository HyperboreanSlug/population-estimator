[project]
name = "population-estimator"
version = "0.1.0"
description = "Multi-source US population estimation at county level"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pyyaml>=6.0",
]

[project.scripts]
popest = "popest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
