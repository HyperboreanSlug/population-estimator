[project]
name = "population-estimator"
version = "0.1.0"
description = "Multi-source US population estimation at county level"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Geospatial clients (VIIRS/WorldPop rasters) are optional; the building
# footprints method runs on cached counts and needs none of these.
geo = [
    "geopandas>=0.14",
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.0",
]
# SOCKS proxy support (POP_EST_SOCKS_PROXY) for resolvers that block
# specific government hosts (for example cms.gov).
proxy = [
    "requests[socks]>=2.31",
]

[project.scripts]
popest = "popest.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
